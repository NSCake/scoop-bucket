# Sync this bucket's manifests with the rolling artifacts they point at.
#
# Each app's manifest points at an IMMUTABLE, run-numbered release asset
# (ttrff-windows-<run>.zip on the app repo's rolling release). This workflow discovers the
# newest asset via the GitHub API, downloads it, hashes it, and updates the manifest's
# url + hash + version atomically -- URL and hash always describe the SAME bytes, so a
# concurrent app-repo build can never change the artifact under a recorded hash (the
# failure mode of a fixed-name rolling asset).
#
# Runs on a schedule, on any push to this repo (so a new manifest gets its initial hash),
# and manually. Adding a new package = drop <app>.json in the root with a `release_repo`
# (owner/name) + `release_tag` + `asset_pattern`; this workflow keeps it current with no
# per-app config.
name: sync-manifests

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest hashes + versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $changed = $false
          Get-ChildItem -Filter *.json | ForEach-Object {
            $manifest = $_.Name
            $json = Get-Content $manifest -Raw | ConvertFrom-Json
            if (-not $json.release_repo) { return }

            Write-Host "syncing $manifest ..."
            # discover the newest run-numbered asset on the app repo's rolling release
            $assets = gh api "repos/$($json.release_repo)/releases/tags/$($json.release_tag)" `
                        --jq '.assets[] | .name' 2>$null
            if (-not $assets) {
              Write-Warning "::warning file=$manifest::no release/assets found for $($json.release_repo)@$($json.release_tag); leaving manifest unchanged"
              return
            }
            $newest = $assets | Where-Object { $_ -match '^ttrff-windows-(\d+)\.zip$' } |
              Sort-Object { [int]($_ -replace '^ttrff-windows-(\d+)\.zip$','$1') } -Descending |
              Select-Object -First 1
            if (-not $newest) { return }

            $newUrl = "https://github.com/$($json.release_repo)/releases/download/$($json.release_tag)/$newest"
            if ($json.url -eq $newUrl -and $json.hash) {
              Write-Host "  already at newest asset ($newest)"
              return
            }

            $tmp = New-TemporaryFile
            try {
              Invoke-WebRequest -Uri $newUrl -OutFile $tmp -MaximumRedirection 10
              $hash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
            } catch {
              Write-Warning "::warning file=$manifest::download failed ($($_.Exception.Message)); leaving manifest unchanged"
              return
            } finally {
              Remove-Item $tmp -Force -ErrorAction SilentlyContinue
            }

            # monotonic version: bump the last component so scoop update always sees it
            $parts = "$($json.version)".Split('.')
            $n = [int]$parts[-1]; $parts[-1] = [string]($n + 1)
            $json.version = $parts -join '.'
            $json.url = $newUrl
            $json.hash = $hash
            # keep the manifest self-documenting but drop the discovery keys from the
            # published JSON (scoop ignores unknown keys; keep them for the next sync)
            $json | ConvertTo-Json -Depth 10 | Set-Content $manifest
            $changed = $true
            Write-Host "  updated: version $($json.version) -> $newest"
          }

          if (-not $changed) {
            Write-Host "nothing to do"
            return
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "sync: refresh artifact hashes [skip ci]"
          git push
